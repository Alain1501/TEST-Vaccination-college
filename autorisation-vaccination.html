var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],

  }

  *{box-sizing:border-box;}

    cursor:pointer;
  }
  .help-email-link:hover{color:#8e1c17;}

  .step{display:none;}

    margin:0 0 16px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);

    margin-bottom:6px;

    background:var(--card);
    color:var(--ink);
    font-size:.95rem;
    font-family:inherit;

  .radio-line label{cursor:pointer;width:100%;}

  }

    border-radius:8px;

    background:var(--card);
    cursor:pointer;
    font-size:.86rem;
    font-weight:600;
    color:var(--ink-soft);
    transition:all .15s ease;
  }
  .choice-btn.yes.selected{
    background:var(--green-100);
    border-color:var(--green-border);
    color:var(--green-700);
  }
  .choice-btn.no.selected{
    background:var(--red-100);
    border-color:var(--red-border);
    color:var(--red-700);
  }
  .sub-checks{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:none;
  }
  .sub-checks.show{display:block;}
  .sub-check-line{margin-bottom:10px;}

    display:flex;gap:8px;align-items:flex-start;font-size:.86rem;font-weight:600;
    cursor:pointer;padding:8px;margin:0 -8px;border-radius:8px;
    transition:background .12s ease;
  }
  .sub-check-line label:hover{background:var(--blue-100);}
  .sub-check-line label:active{background:var(--green-100);}

    align-items:flex-start;

    padding:12px;
    margin-bottom:10px;

    transition:background .12s ease, border-color .12s ease;

  }

    border:none;

const SUPPORTED_LANGS = ["fr","en","ar","tr","ps","ku","ro","ka","sq","am","zh","prs","es","pt","ru","uk","mo"];
function detectInitialLang(){
  try{
    const params = new URLSearchParams(window.location.search);
    const fromUrl = params.get('lang');
    if(fromUrl && SUPPORTED_LANGS.includes(fromUrl)) return fromUrl;
  }catch(e){}
  return 'fr';
}
let currentLang = detectInitialLang();

function tr(key){
  const dict = I18N[currentLang] || I18N.fr;
  return (dict && dict[key] !== undefined) ? dict[key] : (I18N.fr[key] || '');
}

let langCycleIndex = 0;
// Correspondance langue -> fichier PNG du dossier /Flags/ (drapeaux réels fournis,
// plus aucun drapeau en SVG généré). دری et پښتو partagent volontairement af.png.
const FLAG_FILES = {
  fr:'fr', en:'gb-eng', ar:'sa', tr:'tr', ps:'af', ku:'iq', ro:'ro', ka:'ge',
  sq:'al', am:'et', zh:'cn', prs:'af', es:'es', pt:'pt', ru:'ru', uk:'ua', mo:'md'
};
function flagImg(code, cls){
  return `<img class="${cls}" src="Flags/${FLAG_FILES[code] || 'fr'}.png" alt="">`;
}
let langCycleTimer = null;
function startLangCycle(){
  const textEl = document.getElementById('langSwitcherText');
  const flagEl = document.getElementById('langSwitcherFlag');
  if(!textEl) return;
  function paint(){
    const code = SUPPORTED_LANGS[langCycleIndex];
    textEl.textContent = LANG_SELF_LABEL[code] || '';
    if(flagEl) flagEl.innerHTML = flagImg(code, 'langSwitcherFlagImg');
  }
  paint();
  if(langCycleTimer) clearInterval(langCycleTimer);
  langCycleTimer = setInterval(()=>{
    textEl.style.opacity = 0;
    if(flagEl) flagEl.style.opacity = 0;
    setTimeout(()=>{
      langCycleIndex = (langCycleIndex + 1) % SUPPORTED_LANGS.length;
      paint();
      textEl.style.opacity = 1;
      if(flagEl) flagEl.style.opacity = 1;
    }, 300);
  }, 1800);
}

function buildLangBar(){
  const panel = document.getElementById('langPanel');
  panel.innerHTML = '';
  SUPPORTED_LANGS.forEach(code=>{
    const isActive = code === currentLang;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'langOption' + (isActive ? ' active' : '');
    b.innerHTML = `<span class="langOptionCheck">${isActive ? '✓' : ''}</span>${flagImg(code, 'langOptionFlag')}<span>${I18N[code].langName}</span>`;
    b.addEventListener('click', ()=>{
      panel.hidden = true;
      // Dès qu'une langue est choisie, le bouton arrête de défiler et affiche
      // définitivement la langue sélectionnée.
      if(langCycleTimer){ clearInterval(langCycleTimer); langCycleTimer = null; }
      const textEl = document.getElementById('langSwitcherText');
      const flagEl = document.getElementById('langSwitcherFlag');
      if(textEl) textEl.textContent = LANG_SELF_LABEL[code] || code;
      if(flagEl) flagEl.innerHTML = flagImg(code, 'langSwitcherFlagImg');
      if(code === currentLang) return;
      currentLang = code;
      applyLanguage();
    });
    panel.appendChild(b);
  });
}

document.getElementById('langSwitcherBtn').addEventListener('click', (e)=>{

});
document.addEventListener('click', (e)=>{

    panel.hidden = true;

});

function applyLanguage(){
  const dict = I18N[currentLang] || I18N.fr;
  document.documentElement.setAttribute('lang', currentLang);
  document.documentElement.setAttribute('dir', dict.dir);
  document.title = dict.pageTitle;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    const val = tr(key);
    if(val) el.textContent = val;
  });

  // Cas particulier : l'adresse email dans pageSubtitle est mise en évidence
  // (lien cliquable, en évidence, jamais coupée au milieu par un retour à la ligne)
  const subtitleEl = document.getElementById('pageSubtitle');
  if(subtitleEl){
    const subtitleText = tr('pageSubtitle');
    const emailAddr = 'vaccin-hpv@ghsif.fr';
    if(subtitleText && subtitleText.includes(emailAddr)){
      subtitleEl.innerHTML = subtitleText.split(emailAddr).join(
        `<a href="mailto:${emailAddr}" class="subtitleEmail">${emailAddr}</a>`
      );
    } else if(subtitleText){
      subtitleEl.textContent = subtitleText;
    }
  }
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.getAttribute('data-i18n-placeholder');
    const val = tr(key);
    if(val) el.setAttribute('placeholder', val);
  });

  buildLangBar();
  renderStepper();

  // Rafraîchit le texte "Sélectionner" des menus collège/commune dans la nouvelle langue,
  // en conservant le filtre commune en cours (si un collège est déjà choisi)
  const currentCommune = document.getElementById('schoolTown').value;
  populateCommuneSelect();
  populateCollegeSelect(currentCommune || null);

  updateCaptchaLabel();
  if(typeof updateHelpEmailLink === 'function') updateHelpEmailLink();
  if(current === totalSteps) buildSummary();
}
const totalSteps = 6;
let current = 1;

const stepperEl = document.getElementById('stepper');
for(let i=1;i<=totalSteps;i++){
  const d = document.createElement('div');
  d.className = 'dot';
  d.id = 'dot'+i;
  stepperEl.appendChild(d);
}

function renderStepper(){
  const dict = I18N[currentLang] || I18N.fr;
  for(let i=1;i<=totalSteps;i++){
    const d = document.getElementById('dot'+i);
    d.className = 'dot' + (i<current?' done':'') + (i===current?' active':'');
  }
  document.getElementById('stepLabelLine').innerHTML =
    `${dict.stepWord} <strong>${current}</strong> ${dict.stepOf} ${totalSteps} — ${dict.stepNames[current-1]}`;
  document.getElementById('prevBtn').style.visibility = current===1 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = current===totalSteps ? dict.doneBtn : dict.nextBtn;
  document.getElementById('nextBtn').style.display = current===totalSteps ? 'none' : 'block';
}

function showStep(n){
  document.querySelectorAll('.step').forEach(s=>{
    s.classList.toggle('active', parseInt(s.dataset.step)===n);
  });
  renderStepper();
  window.scrollTo({top:0,behavior:'smooth'});
  if(n===5){
    // le canvas de signature a une taille nulle tant qu'il est caché (display:none) ;
    // on force son recalcul de taille une fois l'étape affichée
    requestAnimationFrame(()=>{ pad1.refresh(); pad2.refresh(); });
  }
  if(n===6){
    newCaptchaChallenge();
  }
}

function collegeCounts(){
  const counts = {};
  SCHOOLS.forEach(([,college])=>{ counts[college] = (counts[college]||0) + 1; });
  return counts;
}
const COLLEGE_NAME_COUNTS = collegeCounts();

function populateCommuneSelect(){
  const sel = document.getElementById('schoolTown');
  const prevVal = sel.value;
  const communes = [...new Set(SCHOOLS.map(([c])=>c))].sort((a,b)=>a.localeCompare(b,'fr'));
  sel.innerHTML = `<option value="">${tr('sexSelectPlaceholder')}</option>` +
    communes.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(communes.includes(prevVal)) sel.value = prevVal;
}

function populateCollegeSelect(filterCommune){
  const sel = document.getElementById('schoolName');
  const prevVal = sel.value;
  let list = filterCommune ? SCHOOLS.filter(([c])=>c===filterCommune) : SCHOOLS.slice();
  list = list.slice().sort((a,b)=>a[1].localeCompare(b[1],'fr'));
  sel.innerHTML = `<option value="">${tr('sexSelectPlaceholder')}</option>` +
    list.map(([commune,college])=>{
      const label = (!filterCommune && COLLEGE_NAME_COUNTS[college] > 1) ? `${college} (${commune})` : college;
      return `<option value="${college}" data-commune="${commune}">${label}</option>`;
    }).join('');
  if(list.some(([,college])=>college===prevVal)) sel.value = prevVal;
}

document.getElementById('schoolTown').addEventListener('change', ()=>{
  const commune = document.getElementById('schoolTown').value;
  populateCollegeSelect(commune || null);
  markInvalid(document.getElementById('schoolTown'), false);
});

document.getElementById('schoolName').addEventListener('change', ()=>{
  const sel = document.getElementById('schoolName');
  const opt = sel.selectedOptions[0];
  const commune = opt ? opt.dataset.commune : '';
  if(commune){
    document.getElementById('schoolTown').value = commune;
    populateCollegeSelect(commune);
    markInvalid(document.getElementById('schoolTown'), false);
  }
  markInvalid(sel, false);
});

// ---- Signature pads ----
function setupPad(id){
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let hasDrawn = false;

  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#0b3d5c';
  }
  resize();
  function resizePreserving(){
    const data = hasDrawn ? canvas.toDataURL() : null;
    resize();
    if(data){
      const img = new Image();
      img.onload = ()=> ctx.drawImage(img,0,0,canvas.getBoundingClientRect().width,canvas.getBoundingClientRect().height);
      img.src = data;
    }
  }
  window.addEventListener('resize', resizePreserving);

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX - rect.left, y: t.clientY - rect.top};
  }
  function start(e){
    drawing = true; hasDrawn = true;
    // La condition de validité porte sur "au moins une signature", donc dessiner sur l'une
    // ou l'autre retire le surlignage rouge des deux cadres.
    markInvalid(canvas.closest('.sig-wrap'), false);
    const otherCanvas = document.getElementById(id === 'sig1' ? 'sig2' : 'sig1');
    markInvalid(otherCanvas.closest('.sig-wrap'), false);
    const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault();
  }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; },
    isEmpty(){ return !hasDrawn; },
    dataUrl(){ return canvas.toDataURL('image/png'); },
    refresh(){ resizePreserving(); }
  };
}
const pad1 = setupPad('sig1');
const pad2 = setupPad('sig2');
function clearSig(n){ (n===1?pad1:pad2).clear(); }

// ---- Validation per step ----
function markInvalid(el, invalid){
  if(!el) return;
  el.classList.toggle('field-invalid', !!invalid);
}
function clearInvalidOnChange(el){
  if(!el) return;
  const clear = () => markInvalid(el, false);
  el.addEventListener('input', clear);
  el.addEventListener('change', clear);
}
// Les champs texte/select retirent leur surlignage rouge dès que l'utilisateur les modifie
['childLastName','childFirstName','childDob','childSex','childClass','schoolName','schoolTown',
 'p1Name','p1Phone','p1Nir','p2Nir','signDate','captchaAnswer'].forEach(id => clearInvalidOnChange(document.getElementById(id)));

// Cocher une déclaration "un seul parent" retire le message d'erreur de signature
// (utile si une seule signature était déjà présente et qu'il ne manquait que cette case)
['soloOnly','soloAbsent'].forEach(id=>{
  document.getElementById(id).addEventListener('change', ()=>{
    document.getElementById('sigError').classList.remove('show');
  });
});

function validateStep(n){
  if(n===1){
    const ids = ['childLastName','childFirstName','childDob','childSex','childClass','schoolName','schoolTown'];
    let ok = true;
    ids.forEach(id=>{
      const el = document.getElementById(id);
      const empty = el.value.trim() === '';
      markInvalid(el, empty);
      if(empty) ok = false;
    });
    return ok;
  }
  if(n===2){
    const attach = document.querySelector('input[name="attach"]:checked');
    const p1Name = document.getElementById('p1Name');
    const p1Phone = document.getElementById('p1Phone');
    const p1Nir = document.getElementById('p1Nir');
    const p2Nir = document.getElementById('p2Nir');
    const p1NirOk = p1Nir.value.length === 15;
    const p2NirOk = p2Nir.value.length === 0 || p2Nir.value.length === 15;
    markInvalid(p1Name, p1Name.value.trim()==='');
    markInvalid(p1Phone, p1Phone.value.trim()==='');
    markInvalid(p1Nir, !p1NirOk);
    markInvalid(p2Nir, !p2NirOk);
    document.querySelectorAll('input[name="attach"]').forEach(r=>{
      markInvalid(r.closest('.radio-line'), !attach);
    });
    return p1Name.value.trim() !== '' &&
           p1Phone.value.trim() !== '' &&
           p1NirOk && p2NirOk &&
           !!attach;
  }
  if(n===3){
    const ok = authState.hpv && authState.acwy && authState.other;
    document.getElementById('authError').classList.toggle('show', !ok);
    ['blockHpv','blockAcwy','blockOther'].forEach((id,i)=>{
      const states = [authState.hpv, authState.acwy, authState.other];
      markInvalid(document.getElementById(id), !states[i]);
    });
    return !!ok;
  }
  if(n===4){
    const checked = document.querySelector('input[name="carnet"]:checked');
    document.querySelectorAll('.carnet-option').forEach(o=>markInvalid(o, !checked));
    return !!checked;
  }
  if(n===5){
    const signDateEl = document.getElementById('signDate');
    const dateOk = signDateEl.value.trim() !== '';
    const soloOnly = document.getElementById('soloOnly').checked;
    const soloAbsent = document.getElementById('soloAbsent').checked;
    const sig1ok = !pad1.isEmpty();
    const sig2ok = !pad2.isEmpty();
    const bothSigs = sig1ok && sig2ok;
    const atLeastOneSig = sig1ok || sig2ok;
    const soloDeclared = soloOnly || soloAbsent;
    // Les deux signatures suffisent seules. Une seule signature (celle du parent 1 OU celle
    // du parent 2, peu importe lequel) suffit aussi, à condition de cocher une des deux
    // déclarations "un seul parent" ci-dessous (ex. parent absent, ou seul responsable légal).
    const ok = dateOk && (bothSigs || (atLeastOneSig && soloDeclared));
    document.getElementById('sigError').classList.toggle('show', !ok);
    markInvalid(signDateEl, !dateOk);
    markInvalid(document.getElementById('sig1').closest('.sig-wrap'), !atLeastOneSig);
    markInvalid(document.getElementById('sig2').closest('.sig-wrap'), !atLeastOneSig);
    return ok;
  }
  return true;
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(!validateStep(current)) return;
  if(current < totalSteps){
    current++;
    if(current===totalSteps) buildSummary();
    showStep(current);
  }
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(current>1){ current--; showStep(current); }
});

function labelYesNo(v){
  const dict = I18N[currentLang] || I18N.fr;
  return v==='yes' ? dict.yes : (v==='no' ? dict.no : dict.dash);
}

// ---- Vérification anti-robot (énigme simple, vérifiée aussi côté flux Power Automate) ----
let captchaA = 0, captchaB = 0;
function newCaptchaChallenge(){
  captchaA = Math.floor(Math.random()*8) + 1;
  captchaB = Math.floor(Math.random()*8) + 1;
  const input = document.getElementById('captchaAnswer');
  if(input){ input.value = ''; markInvalid(input, false); input.classList.remove('field-valid'); }
  document.getElementById('captchaError').classList.remove('show');
  updateCaptchaLabel();
}
function updateCaptchaLabel(){
  const dict = I18N[currentLang] || I18N.fr;
  const label = document.getElementById('captchaLabel');
  if(label) label.textContent = dict.captchaLabel.replace('{a}', captchaA).replace('{b}', captchaB);
}
function captchaIsValid(){
  const input = document.getElementById('captchaAnswer');
  return parseInt(input.value, 10) === (captchaA + captchaB);
}
// Retour visuel en temps réel : le cadre passe au vert dès que la réponse tapée est correcte
document.getElementById('captchaAnswer').addEventListener('input', ()=>{
  const input = document.getElementById('captchaAnswer');
  if(captchaIsValid()){
    input.classList.remove('field-invalid');
    input.classList.add('field-valid');
    document.getElementById('captchaError').classList.remove('show');
  } else {
    input.classList.remove('field-valid');
  }
});

function buildSummary(){
  const dict = I18N[currentLang] || I18N.fr;
  const other = [];
  if(document.getElementById('subDtp').checked) other.push('DTP-coq');
  if(document.getElementById('subRor').checked) other.push('ROR');
  if(document.getElementById('subHepb').checked) other.push('Hépatite B');

  const items = [
    [dict.recapChild, `${document.getElementById('childFirstName').value} ${document.getElementById('childLastName').value}`],
    [dict.recapSchool, `${document.getElementById('schoolName').value} (${document.getElementById('schoolTown').value})`],
    [dict.recapHpv, labelYesNo(authState.hpv)],
    [dict.recapAcwy, labelYesNo(authState.acwy)],
    [dict.recapOther, labelYesNo(authState.other) + (other.length ? " — " + other.join(', ') : '')],
    [dict.recapCarnet, document.getElementById('carnetFourni').checked ? dict.carnetProvided : dict.carnetNotProvided],
    [dict.recapSignatures, (!pad1.isEmpty()?"1 ✓ ":"") + (!pad2.isEmpty()?"2 ✓":"")]
  ];
  const el = document.getElementById('summaryList');
  el.innerHTML = items.map(([k,v])=>`<div class="summary-item"><span>${k}</span><span>${v}</span></div>`).join('');

  updateMailtoBtn();
}

// téléphone x2) ; tous les autres champs de Colibri sont sautés (laissés vides). ----
const TABU = "\t", BAS = "\x96", DROITE = "\x98", ENTREE = "\r", ESPACE = " ";
const NB_PAUSE = 100, PAUSE = new Array(NB_PAUSE+1).join(DROITE);

// qrcode.js encode par défaut en UTF-8 ; on force un passage en octets bruts
// (1 caractère = 1 octet) pour que les codes de touches spéciales (Tab, flèches...)
// soient transmis tels quels à la douchette.
qrcode.stringToBytesFuncs['default'] = function(s){
  const bytes = [];
  for(let i = 0; i < s.length; i++){
    bytes.push(s.charCodeAt(i) & 0xff);
  }
  return bytes;
};

function ddmmyyyyDigits(isoDate){
  if(!isoDate) return "";
  const [y,m,d] = isoDate.split('-');
  return d + m + y;
}

// Commentaire : une ligne par vaccin réellement autorisé par les parents.
function buildCommentText(){
  const lines = ["Autorisation pour: "];
  if(authState.hpv === 'yes') lines.push("HPV");
  if(authState.acwy === 'yes') lines.push("MEN C");
  if(authState.other === 'yes'){
    if(document.getElementById('subHepb').checked) lines.push("HEP B");
    if(document.getElementById('subDtp').checked) lines.push("DTCP");
    if(document.getElementById('subRor').checked) lines.push("ROR");
  }
  return lines.join(ENTREE + "\n");
}

function buildPatientQrSequence(){
  const childLast = document.getElementById('childLastName').value.trim();
  const childFirst = document.getElementById('childFirstName').value.trim();
  const dob = document.getElementById('childDob').value;
  const sex = document.getElementById('childSex').value;
  const nss1 = document.getElementById('p1Nir').value.replace(/\D/g,'');
  const nss2 = document.getElementById('p2Nir').value.replace(/\D/g,'');
  const tel1 = document.getElementById('p1Phone').value.replace(/\D/g,'');
  const tel2 = document.getElementById('p2Phone').value.replace(/\D/g,'');

  // Sexe : liste à suggestions dans Colibri, flèche bas + tab pour Garçon,
  // espace + tab pour Féminin, simple tab si non renseigné.
  let sexSeq;
  if(sex === 'F'){ sexSeq = ESPACE + TABU; }
  else if(sex === 'M'){ sexSeq = BAS + TABU; }
  else { sexSeq = TABU; }

  const commentSeq = buildCommentText();

  return [
    childLast + TABU,                     // Nom de famille
    "" + TABU,                            // Nom d'usage
    childFirst + TABU,                    // Prénom(s)
    sexSeq,                               // Sexe
    ddmmyyyyDigits(dob) + TABU,           // Date de naissance
    "" + TABU,                            // Pays de naissance (non collecté dans ce formulaire)
    "" + TABU,                            // Nationalité (non collecté dans ce formulaire)
    nss1 + TABU,                          // N° sécu premier ouvrant droit
    nss2 + TABU,                          // N° sécu second ayant droit
    "" + TABU,                            // Couverture sociale (non collecté)
    "" + TABU,                            // Complémentaire santé (non collecté)
    TABU,                                 // Code régime
    TABU,                                 // Médecin traitant
    "" + TABU,                            // Adresse 1 (non collecté)
    "" + TABU,                            // Adresse 2
    "" + TABU,                            // Code postal ou ville (non collecté)
    tel1 + TABU,                          // Téléphone 1 (parent 1)
    tel2 + TABU,                          // Téléphone 2 (parent 2)
    "" + TABU,                            // Email (non collecté)
    "" + TABU,                            // Email secondaire
    commentSeq                            // Commentaire (dernier champ, pas de Tab final)
  ].join("");
}

function drawPatientQrCode(doc, x, y, size){
  const seq = buildPatientQrSequence();
  const q = qrcode(0, "L");
  q.addData(seq, "Byte");
  q.make();
  const count = q.getModuleCount();

  // Rendu via un canvas (comme les 3 autres QR de cette page, déjà intégrés en
  // image PNG) plutôt que des centaines d'appels de dessin vectoriel un par un,
  // nettement plus rapide et fiable sur mobile.
  const scale = 8; // pixels par module, pour une image nette
  const canvas = document.createElement('canvas');
  canvas.width = count * scale;
  canvas.height = count * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#000000';
  for(let r = 0; r < count; r++){
    for(let c = 0; c < count; c++){
      if(q.isDark(r, c)){
        ctx.fillRect(c*scale, r*scale, scale, scale);
      }
    }
  }
  const dataUrl = canvas.toDataURL('image/png');
  doc.addImage(dataUrl, 'PNG', x, y, size, size);
}

// Nom-Prénom-Collège.pdf (le collège est ajouté seulement s'il est renseigné)
function buildPdfFilename(){
  const childLastRaw = document.getElementById('childLastName').value.trim();
  const childFirstRaw = document.getElementById('childFirstName').value.trim();
  const childLast = childLastRaw.toUpperCase();
  const childFirst = childFirstRaw
    ? childFirstRaw.charAt(0).toUpperCase() + childFirstRaw.slice(1).toLowerCase()
    : '';
  const school = document.getElementById('schoolName').value.trim();
  const town = document.getElementById('schoolTown').value.trim();
  const parts = [childLast, childFirst, school, town].filter(Boolean);
  const base = parts.length ? parts.join(' ') : 'enfant';
  return base + '.pdf';
}

// ---- Téléchargement ----
document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('downloadBtn');
  const originalLabel = btn.textContent;

  // Vérification anti-robot avant le téléchargement
  if(!captchaIsValid()){
    markInvalid(document.getElementById('captchaAnswer'), true);
    document.getElementById('captchaAnswer').classList.remove('field-valid');
    document.getElementById('captchaError').classList.add('show');
    alert(tr('captchaAlert'));
    return;
  }

  btn.disabled = true;
  btn.textContent = tr('generatingLabel');
  try{
    const doc = buildPdf();
    const filename = buildPdfFilename();
    const blob = doc.output('blob');

    const downloadsApi = (window.claude && typeof window.claude.use === 'function')
      ? await window.claude.use('downloads')
      : null;

    if(downloadsApi){
      try{
        await downloadsApi.save({ filename, data: blob });
        document.getElementById('downloadedNote').style.display = 'block';
        newCaptchaChallenge();
      } catch(saveErr){
        if(saveErr && saveErr.code === 'declined'){
          // annulé par l'utilisateur, rien à signaler
        } else {
          console.error(saveErr);
          alert(tr('downloadFailAlert').replace('{code}', saveErr && saveErr.code ? saveErr.code : 'unknown'));
        }
      }
    } else {
      doc.save(filename);
      document.getElementById('downloadedNote').style.display = 'block';
      newCaptchaChallenge();
    }
  } catch(err){
    console.error(err);
    alert(tr('downloadErrorAlert'));
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

document.getElementById('signDate').valueAsDate = new Date();
